name: Strided profile

on:
  workflow_dispatch:
  push:
    branches: [profile/strided-memory]
    paths:
      - 'native/**'
      - 'tests/strided*'
      - 'tests/native-strided.c'
      - 'CMakeLists.txt'
      - '.github/workflows/strided-profile.yml'

concurrency:
  group: strided-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: SBCL / native x86-64
    runs-on: ubuntu-latest
    env:
      LISP: sbcl-bin
      TRIVIAL_SIMD_BACKEND: native
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_STRIDED_PROFILE=ON
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
      - uses: 40ants/setup-lisp@v4
        with:
          asdf-system: trivial-simd
          cache: false
      - name: Check Lisp
        shell: lispsh -eo pipefail {0}
        run: |
          ros config set dynamic-space-size 4GB
          ros -Q run --load tests/run.lisp
          ros -Q run --eval '(handler-case (load "tests/strided-profile-check.lisp") (error (condition) (format *error-output* "~A~%" condition) (uiop:quit 1)))'
          python3 tests/test-strided-gates.py
      - name: Measurements
        shell: lispsh -eo pipefail {0}
        run: |
          mkdir -p strided-profile
          lscpu > strided-profile/machine.txt
          cc --version >> strided-profile/machine.txt
          echo '[[40393, 16384, "f32", "sum", [1, -2, 1, 1]], [40418, 256, "f32", "sum", [1, -1, 1, 1]], [40493, 256, "f32", "sum", [1, 2, 1, 1]]]' > strided-profile/seed-limits.json
      - name: Validate normal dispatch
        shell: lispsh -eo pipefail {0}
        run: |
          cp strided-profile/seed-limits.json strided-profile/candidate-limits.json
          python3 -c 'import json; rows=json.load(open("strided-profile/seed-limits.json")); print("("); [print("(:%s :%s (%s) %s)" % (t,o," ".join(map(str,l)),n)) for k,n,t,o,l in rows]; print(")")' > strided-profile/candidate-cases.lisp
          cp native/strided-memory-gates.h strided-profile/seed-header.h
          cp native/strided-memory-gates.h strided-profile/candidate-header.h
          if [ "$(wc -l < strided-profile/candidate-cases.lisp)" -gt 2 ]; then
            cmake --build build --target trivial_simd --parallel 4
            ros -Q run --load tests/run.lisp
            mkdir -p strided-profile/validation
            export TRIVIAL_SIMD_STRIDED_PROFILE=1
            export TRIVIAL_SIMD_STRIDED_GATES=strided-profile/candidate-cases.lisp
            for trial in 0 1 2 3 4; do
              export TRIVIAL_SIMD_STRIDED_TRIAL=$trial
              variants="general dispatch"
              if [ $((trial % 2)) -eq 1 ]; then variants="dispatch general"; fi
              for variant in $variants; do
                export TRIVIAL_SIMD_STRIDED_VARIANT=$variant
                export TRIVIAL_SIMD_STRIDED_OUTPUT="strided-profile/validation/$variant-$trial.csv"
                ros -Q run --eval '(handler-case (load "tests/strided-bench.lisp") (error (condition) (format *error-output* "~A~%" condition) (uiop:quit 1)))'
              done
            done
            python3 tests/strided-gates.py --variant dispatch --limits strided-profile/candidate-limits.json --header x86-64 strided-profile/validation/*.csv > strided-profile/validated-header.h
          else
            cp strided-profile/candidate-header.h strided-profile/validated-header.h
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: strided-profile-x86-64
          path: strided-profile
