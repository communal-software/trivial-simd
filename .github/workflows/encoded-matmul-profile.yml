name: Encoded matmul profile

on:
  workflow_dispatch:

concurrency:
  group: encoded-matmul-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: SBCL / native x86-64
    runs-on: ubuntu-latest
    env:
      LISP: sbcl-bin
      TRIVIAL_SIMD_BACKEND: native
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Native checks
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: 40ants/setup-lisp@v4
        with:
          asdf-system: trivial-simd
          cache: false
      - name: Reserve a 4 GiB SBCL heap
        shell: lispsh -eo pipefail {0}
        run: ros config set dynamic-space-size 4GB
      - name: Measurements
        shell: lispsh -eo pipefail {0}
        run: |
          lscpu > encoded-matmul-profile.txt
          for trial in 1 2 3 4 5; do
            echo "Trial $trial" >> encoded-matmul-profile.txt
            ros -Q run --eval '(handler-case (load "tests/encoded-matmul-bench.lisp") (error (condition) (format *error-output* "~A~%" condition) (uiop:quit 1)))' >> encoded-matmul-profile.txt
          done
          cat encoded-matmul-profile.txt
      - uses: actions/upload-artifact@v4
        with:
          name: encoded-matmul-profile
          path: encoded-matmul-profile.txt
